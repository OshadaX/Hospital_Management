version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: src/backend/gateway/APIGateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  doctor-service:
    build:
      context: .
      dockerfile: src/backend/services/DoctorManagementService/Dockerfile
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

  patient-service:
    build:
      context: .
      dockerfile: src/backend/services/PatientManagementService/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

  appointment-service:
    build:
      context: .
      dockerfile: src/backend/services/AppointmentManagementService/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

  lab-service:
    build:
      context: .
      dockerfile: src/backend/services/LabTestManagementService/Dockerfile
    ports:
      - "5004:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

  medicine-service:
    build:
      context: .
      dockerfile: src/backend/services/MedicineManagementService/Dockerfile
    ports:
      - "5005:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

  feedback-service:
    build:
      context: .
      dockerfile: src/backend/services/FeedbackManagementService/Dockerfile
    ports:
      - "5006:5006"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
